<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Download Screenshot Monitor</title>
  <link href="https://cdn.jsdelivr.net/npm/@sweetalert2/theme-bubble@5/bubble.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    .container {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
      padding: 40px;
      max-width: 500px;
      width: 100%;
      text-align: center;
    }
    
    .logo {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      border-radius: 20px;
      margin: 0 auto 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      color: white;
      font-weight: 700;
    }
    
    h1 {
      font-size: 28px;
      font-weight: 700;
      color: #1a1a1a;
      margin-bottom: 8px;
    }
    
    .subtitle {
      font-size: 16px;
      color: #666;
      margin-bottom: 32px;
      line-height: 1.5;
    }
    
    .package-info {
      background: #f8f9fa;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 32px;
      border: 1px solid #e9ecef;
    }
    
    .package-info h3 {
      font-size: 18px;
      font-weight: 600;
      color: #1a1a1a;
      margin-bottom: 16px;
    }
    
    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      text-align: left;
    }
    
    .info-item {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #e9ecef;
    }
    
    .info-item:last-child {
      border-bottom: none;
    }
    
    .info-label {
      font-weight: 500;
      color: #666;
      font-size: 14px;
    }
    
    .info-value {
      font-weight: 600;
      color: #1a1a1a;
      font-size: 14px;
    }
    
    .download-btn {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      border: none;
      border-radius: 12px;
      padding: 16px 32px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      text-decoration: none;
      display: inline-block;
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
    }
    
    .download-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(102, 126, 234, 0.5);
    }
    
    .version-badge {
      background: #e3f2fd;
      color: #1976d2;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      margin-left: 8px;
    }
    
    @media (max-width: 480px) {
      .container {
        padding: 24px;
      }
      
      h1 {
        font-size: 24px;
      }
      
      .info-grid {
        grid-template-columns: 1fr;
      }
      
      .logo {
        width: 60px;
        height: 60px;
        font-size: 24px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">📱</div>
    
    <h1>Screenshot Monitor</h1>
    <p class="subtitle">Remote device monitoring and control for iOS</p>
    
    <div class="package-info">
      <h3>Package Details</h3>
      <div class="info-grid">
        <div class="info-item">
          <span class="info-label">Package:</span>
          <span class="info-value">com.mateus.screenshotmonitor</span>
        </div>
        <div class="info-item">
          <span class="info-label">Version:</span>
          <span class="info-value">0.0.1-36<span class="version-badge">Latest</span></span>
        </div>
        <div class="info-item">
          <span class="info-label">Architecture:</span>
          <span class="info-value">iphoneos-arm64</span>
        </div>
        <div class="info-item">
          <span class="info-label">Size:</span>
          <span class="info-value">9.5 KB</span>
        </div>
      </div>
    </div>
    
    <a href="packages/com.mateus.screenshotmonitor_0.0.1-36+debug_iphoneos-arm64.deb" class="download-btn" id="btnDownload">
      Download .deb File
    </a>
  </div>
  
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script>
    document.getElementById('btnDownload').onclick = function(e) {
      e.preventDefault();
      
      Swal.fire({
        title: 'Download Starting!',
        text: 'Your .deb file will begin downloading shortly.',
        icon: 'success',
        showConfirmButton: false,
        timer: 1500,
        background: '#fff',
        color: '#333',
        customClass: {
          popup: 'swal2-bubble'
        }
      }).then(() => {
        window.location.href = this.href;
      });
    }
  </script>
</body>
</html>
